<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw in Flow - 2D流体計算</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <div class="container">
        <header>
            <h1>Draw in Flow</h1>
            <p class="subtitle">格子ボルツマン法による2次元流体計算</p>
        </header>

        <div class="controls">
            <div class="control-row">
                <button id="clearBtn" class="btn">クリア</button>
                <button id="toggleFlowBtn" class="btn">一時停止</button>
                <div class="info-display">
                    <span>時間: <span id="timeValue">0.00</span></span>
                </div>
            </div>

            <div class="control-row">
                <div class="slider-group">
                    <label for="brushSize">ブラシサイズ: <span id="brushSizeValue">10</span></label>
                    <input type="range" id="brushSize" min="3" max="30" value="10">
                </div>
                <div class="slider-group">
                    <label for="reynolds">レイノルズ数: <span id="reynoldsValue">1000</span></label>
                    <input type="range" id="reynolds" min="100" max="5000" value="1000" step="100">
                </div>
            </div>

            <div class="control-row">
                <div class="select-group">
                    <label for="displayMode">表示モード:</label>
                    <select id="displayMode">
                        <option value="0">流速</option>
                        <option value="1">渦度</option>
                        <option value="2">圧力</option>
                        <option value="3">流線 (LIC)</option>
                        <option value="4">ベルヌーイ式</option>
                    </select>
                </div>
            </div>

            <div class="control-row colormap-controls" id="colormapControls">
                <div class="slider-group">
                    <label for="colorScale">スケール: <span id="colorScaleValue">1.00</span></label>
                    <input type="range" id="colorScale" min="0.1" max="5.0" value="1.0" step="0.1">
                </div>
                <div class="slider-group">
                    <label for="colorOrigin">原点: <span id="colorOriginValue">0.00</span></label>
                    <input type="range" id="colorOrigin" min="-2.0" max="2.0" value="0.0" step="0.05">
                </div>
                <span class="colormap-hint">(一時停止中のみ変更可)</span>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="fluidCanvas"></canvas>
            <div class="canvas-hint">
                <span class="hint-mouse">マウスでドラッグして障害物を描画</span>
                <span class="hint-touch">タップしてドラッグして障害物を描画</span>
            </div>
            <div class="grid-overlay" id="gridOverlay"></div>
        </div>

        <div class="legend">
            <div class="legend-bar">
                <div class="legend-negative">負</div>
                <div class="legend-neutral">0</div>
                <div class="legend-positive">正</div>
            </div>
            <div class="legend-labels">
                <span class="legend-blue">青: 負の値 (小)</span>
                <span class="legend-gray">灰: ゼロ (原点)</span>
                <span class="legend-red">赤: 正の値 (大)</span>
            </div>
        </div>

        <footer>
            <p>障害物を描いて、流体が回り込む様子を観察しよう</p>
            <p class="tech-info">計算格子: 200×100 | BGK-LBM D2Q9 | マッハ数 0.1</p>
        </footer>
    </div>

    <script>
        // モジュール読み込み失敗時(404・非対応ブラウザ等)に画面へ表示する
        window.addEventListener('error', (e) => {
            if (document.querySelector('.canvas-error')) return;
            const hint = document.querySelector('.canvas-hint');
            if (hint && !window.__lbmStarted) {
                hint.textContent = '読み込みエラー: ' + (e.message || 'スクリプトの読み込みに失敗しました');
                hint.classList.add('canvas-error');
            }
        }, true);
    </script>
    <script type="module" src="app.js?v=4"></script>
</body>
</html>
