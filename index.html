<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw in Flow - 2D Fluid Visualization</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Draw in Flow</h1>
            <p class="subtitle">2次元流体の流れを可視化</p>
        </header>

        <div class="controls">
            <button id="clearBtn" class="btn">クリア</button>
            <button id="toggleFlowBtn" class="btn">流れ停止</button>
            <div class="slider-group">
                <label for="brushSize">ブラシサイズ: <span id="brushSizeValue">15</span></label>
                <input type="range" id="brushSize" min="5" max="50" value="15">
            </div>
            <div class="slider-group">
                <label for="flowSpeed">流速: <span id="flowSpeedValue">2.0</span></label>
                <input type="range" id="flowSpeed" min="0.5" max="5" value="2" step="0.1">
            </div>
            <div class="slider-group">
                <label for="particleCount">粒子数: <span id="particleCountValue">3000</span></label>
                <input type="range" id="particleCount" min="500" max="8000" value="3000" step="100">
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="fluidCanvas"></canvas>
            <div class="canvas-hint">マウスでドラッグして障害物を描画</div>
        </div>

        <footer>
            <p>障害物を描いて、流体が回り込む様子を観察しよう</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
