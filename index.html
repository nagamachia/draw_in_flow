<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw in Flow - 2D流体可視化</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Draw in Flow</h1>
            <p class="description">キャンバスに障害物を描いて、流体の流れを観察しましょう</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="brushSize">ブラシサイズ: <span id="brushSizeValue">15</span></label>
                <input type="range" id="brushSize" min="5" max="50" value="15">
            </div>
            <div class="control-group">
                <label for="flowSpeed">流速: <span id="flowSpeedValue">2.0</span></label>
                <input type="range" id="flowSpeed" min="0.5" max="5" step="0.1" value="2.0">
            </div>
            <div class="control-group">
                <label for="particleDensity">パーティクル密度: <span id="particleDensityValue">1500</span></label>
                <input type="range" id="particleDensity" min="500" max="3000" step="100" value="1500">
            </div>
            <button id="clearBtn" class="btn">クリア</button>
            <button id="pauseBtn" class="btn">一時停止</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="fluidCanvas"></canvas>
            <div class="canvas-hint">マウスでドラッグして障害物を描画</div>
        </div>

        <footer>
            <p>左から右への一様流の中で、描いた障害物を流体が回り込む様子を観察できます</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
